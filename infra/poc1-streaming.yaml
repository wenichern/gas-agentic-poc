AWSTemplateFormatVersion: "2010-09-09"
Description: POC 1 streaming - IoT Core rule -> Lambda (gate + Bedrock agent). Deploy with scripts/deploy_poc1_streaming.sh
Parameters:
  AlertTopicArn: {Type: String}
  WorkOrderTable: {Type: String}
  ModelId: {Type: String, Default: "us.anthropic.claude-sonnet-4-5-20250929-v1:0", Description: "Must be enabled in your Bedrock account"}
Resources:
  ReadingsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions: [{AttributeName: pk, AttributeType: S}, {AttributeName: ts, AttributeType: N}]
      KeySchema: [{AttributeName: pk, KeyType: HASH}, {AttributeName: ts, KeyType: RANGE}]
      TimeToLiveSpecification: {AttributeName: expires_at, Enabled: true}
      SSESpecification: {SSEEnabled: true}
  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{Effect: Allow, Principal: {Service: lambda.amazonaws.com}, Action: "sts:AssumeRole"}]
      ManagedPolicyArns: ["arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"]
      Policies:
        - PolicyName: agent
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Resource "*" is needed for cross-region inference profiles; tighten to your model/profile ARNs for production.
              - {Effect: Allow, Action: ["bedrock:InvokeModel", "bedrock:Converse"], Resource: "*"}
              - {Effect: Allow, Action: "sns:Publish", Resource: !Ref AlertTopicArn}
              - Effect: Allow
                Action: ["dynamodb:PutItem", "dynamodb:GetItem", "dynamodb:Query"]
                Resource:
                  - !GetAtt ReadingsTable.Arn
                  - !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${WorkOrderTable}"
  AgentFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: lambda_handler.handler
      Timeout: 90
      MemorySize: 256
      Role: !GetAtt FunctionRole.Arn
      Code: ../poc1_field_ops      # `aws cloudformation package` zips and uploads this folder
      Environment:
        Variables:
          READINGS_TABLE: !Ref ReadingsTable
          WORK_ORDER_TABLE: !Ref WorkOrderTable
          ALERT_TOPIC_ARN: !Ref AlertTopicArn
          BEDROCK_MODEL_ID: !Ref ModelId
  SensorRule:
    Type: AWS::IoT::TopicRule
    Properties:
      RuleName: gas_poc1_sensor_rule
      TopicRulePayload:
        Sql: "SELECT *, topic(3) AS asset_id FROM 'gas/sensors/+'"
        AwsIotSqlVersion: "2016-03-23"
        RuleDisabled: false
        Actions: [{Lambda: {FunctionArn: !GetAtt AgentFunction.Arn}}]
  IotInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref AgentFunction
      Action: "lambda:InvokeFunction"
      Principal: iot.amazonaws.com
      SourceArn: !GetAtt SensorRule.Arn
Outputs:
  ReadingsTable: {Value: !Ref ReadingsTable}
  FunctionName: {Value: !Ref AgentFunction}
